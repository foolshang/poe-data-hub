# poe-data-hub configuration

firebase:
  project_id: poe-hub-b4723
  bucket: poe-data-hub

# Phase 7: PoE1 prices added alongside PoE2 (meta is still PoE2-only).
game_versions:
  - poe2
  - poe1

league:
  # Leave blank: the auto-detected non-excluded league is used as "main".
  # Only set this when two non-excluded (non-Standard/Hardcore/Ruthless)
  # leagues are active at once (an overlapping event league) and the
  # auto-picked "first candidate" guess needs to be pinned to the real
  # challenge league.
  poe2_override: ""
  # Was pinned to "Mirage" (2026-07-05) while Mirage and the "Ancestors" event
  # were both active; removed 2026-09-21 -- Mirage ended, the stale value made
  # league detection log a warning every run and, worse, would have been the
  # fallback league name if poe.ninja's league list ever failed to load. Only
  # set it again for a genuine overlap of two non-excluded leagues.
  poe1_override: ""
  cache_ttl_seconds: 43200 # 12h

ggg:
  # trade2/data/stats is the one GGG endpoint this project touches (spec 3.5).
  # Fetched once, cached to disk, refreshed weekly.
  stats_cache_ttl_seconds: 604800 # 7d

rate_limits:
  # seconds between requests, per host
  "poe.ninja": 2
  "poe2scout.com": 2
  "www.pathofexile.com": 2
  "th.pathofexile.com": 2 # phase 11: link_th Thai forum scrape -- separate host/bucket from www.
  "api.steampowered.com": 2

http:
  max_retries: 3
  timeout_seconds: 15

schedule:
  # Bumped 20 -> 180 (2026-08-02): poe1/prices/latest.json alone is ~14MB and
  # was publishing every 20min from us-central1 to the asia-southeast1
  # bucket, driving most of a "Network Inter Region Data Transfer" GCP
  # billing line item (~1.5GB/day). Hash-skip-if-unchanged was considered
  # and rejected -- generated_at + live market movement means the payload
  # almost never matches previous cycle anyway, so it wouldn't have helped.
  # Bumped 180 -> 1440 (2026-09-10): one publish/day. Same egress reasoning
  # taken to its conclusion (~8x less inter-region transfer), and it removes
  # 7/8 of the daily ~80MB prices-poe1 memory spike on the 955MB e2-micro VM
  # (baseline RSS ~239MB, VmHWM ~322MB during a poe1 run -- see PRICES_MAX_AGE
  # in tools/heartbeat_check.py, bumped in lockstep). Tradeoff: published
  # prices are now up to ~24h stale. Drop this back to 180 (or lower) if
  # near-real-time pricing is needed again.
  # news kept at 5min (small files ~fetch <100 entries, freshness matters
  # more there, and it's not a memory factor -- see prices spike note above).
  prices_interval_minutes: 1440
  meta_cron_hour_thailand: 2
  # Manual escape hatch (spec section 9) -- kept for an unplanned/delayed
  # league that league_start_mode's date range below doesn't cover. Bump
  # this and restart if you ever need to force multi-run mode outside the
  # configured window. 1 = single run/day at meta_cron_hour_thailand.
  meta_runs_per_day_league_start: 1
  # Automatic per-game date-based switch (spec section 9) -- when today
  # (Asia/Bangkok calendar date) falls within ANY configured game's
  # [start_date, end_date] (both inclusive), the scheduler switches the
  # meta job to meta_runs_per_day evenly-spaced runs/day on its own, no
  # restart needed, and switches back automatically once every game's
  # window has passed. Each game's value is either a manual
  # {start_date, end_date} (always wins over auto) or "auto"/omitted, in
  # which case the scheduler derives it itself from GGG's Steam News
  # announcements (LeagueDatesFetcher.find_upcoming_launch) -- for a game
  # left on auto, there's normally nothing to do here at all; only add a
  # manual entry if auto-detection ever needs correcting. See status.json's
  # league_start_mode_detail to check what each game currently resolved to.
  league_start_mode:
    meta_runs_per_day: 4
    auto_end_date_offset_days: 21   # derived end_date = detected launch + this
    poe1:
      start_date: "2026-07-25"
      end_date: "2026-08-15"
    poe2: "auto"
  cleanup_hour_thailand: 4
  news_interval_minutes: 5
  # Republishes {game}/gems.json from the internal/ staging copy that
  # refresh-stats.yml's GitHub Actions job writes weekly (see
  # tools/refresh_gems.py, src/main.py's run_gems_once). Cheap
  # Firebase-to-Firebase copy, no external API calls -- daily is plenty.
  gems_cron_hour_thailand: 3
  # Skill-centric collection's own daily cron (approved 2026-09-22), separate
  # from meta_cron_hour_thailand's slot-only run -- only takes effect when
  # skill_meta.collect.scheduled is true (src/main.py's run_scheduler skips
  # registering this job entirely otherwise). Always runs poe1 then poe2,
  # sequential, never parallel (RAM: both peaked >200MB in the first live
  # runs on this e2-micro). Placed after cleanup (04:00) and gems (03:00),
  # ~21h of headroom before the next 02:00 slot-only meta run even on a much
  # slower cycle than the ~71min measured 2026-09-22 -- see SPEC.md 8.10.
  skill_meta_cron_hour_thailand: 5
  # Weekly archive export: a fixed weekly cron, NOT an interval -- an interval's
  # first fire is process-start + 7 days, so every restart moved it (the
  # 2026-10-15 OOM landed exactly 7 days after a restart). Sunday 13:00 ICT
  # sits clear of meta 02:00, gems 03:00, cleanup 04:00 and the skill run
  # (05:00 start, ~3h normally, ~7h on a bad day).
  archive_day_of_week: sun
  archive_hour_thailand: 13

meta:
  sample_per_slot: 100 # NOTE: poe.ninja's builds-search endpoint has no known
                       # pagination param -- observed to always return its
                       # default top-100 page regardless of this value. Kept
                       # here per spec; see src/fetchers/ninja_builds.py.
  min_mod_count: 5

# Skill-meta phase 2: a second, orthogonal (slot, main_skill, level_bracket,
# stat_id) counting dimension alongside the archetype-based one above --
# covers gear and jewels, stored in SQLite's skill_mod_counts table (kept
# forever, same as mod_counts). See src/processing/aggregator.py and
# src/main.py's run_reprocess_char_items.
skill_meta:
  # [lo, hi] pairs, half-open [lo, hi) except the last which is closed so a
  # level-100 character always lands somewhere. A level below the first
  # bracket's lo (e.g. a fresh character) matches none and is skipped for
  # this dimension only -- it still counts normally in the existing
  # archetype-based mod_counts pipeline.
  level_brackets:
    - [28, 65]
    - [65, 75]
    - [75, 90]
    - [90, 100]
  # A (slot, main_skill, level_bracket) cell below this population is
  # considered too thin to publish on its own -- not yet wired to an actual
  # publish step (that's a later phase), but query_skill_mod_counts' 4-tier
  # fallback already uses it to decide when to widen to a coarser tier.
  # (Legacy per-slot dimension only; the skill-centric pipeline below uses
  # percentage thresholds exclusively.)
  min_population_publish: 20

  # Skill-centric collection (2026-09-21): top-100 characters per poe.ninja
  # skill list instead of top-100 per equipment slot. See SPEC.md "Skill-centric
  # collection". Every percentage is of the whole league population
  # (poe.ninja's own count of indexed characters, ~124k), never of the
  # sampled characters. main and spirit (PoE2) skills follow the same rules.
  collect:
    # Whether the scheduler registers the dedicated "skill_meta" cron job
    # (schedule.skill_meta_cron_hour_thailand) -- `--run-meta-once --game <g>
    # --only skill` always runs it regardless of this flag. Approved
    # 2026-09-22 after two full runs + one measured incremental cycle per
    # game (~71.3min combined, comfortably inside the 1-2h budget) -- see
    # SPEC.md 8.10's Scheduling subsection and CLAUDE.md.
    scheduled: true
    min_skill_pct: 0.1          # skip skills used by < this % of the league
    min_ascendancy_pct: 0.1     # cut characters of classes < this % (unascended base classes)
    min_member_list_count: 20   # PoE1 Vaal folding: don't request a Vaal/base list with fewer characters
    fold_vaal: true             # PoE1: "Vaal Reap" characters count under "Reap"
    list_size: 100              # rows kept per list (poe.ninja returns 100)
    reuse_max_age_days: 7       # refetch a character's detail when the stored copy is older
    resume_max_age_hours: 48    # an unfinished run older than this is abandoned, not resumed
    max_failed_list_pct: 5.0    # abort (nothing counted) if more lists than this % fail
    max_failed_char_pct: 25.0   # abort (nothing counted) if more character fetches than this % fail
    snapshot_refresh_seconds: 1800  # re-resolve poe.ninja's index version this often mid-run
    progress_every_lists: 25
    progress_every_chars: 250
  # Publish-time filter for per-skill mods/passives (used by the publish step):
  # drop entries used by < this % of that skill's characters. Percentage only --
  # no count-based cutoff (the old count>=5 / population>=20 rules do not apply).
  # A whole skill/bracket is never dropped this way, only individual mod/passive
  # rows -- its population still shows in skills/index.json and its own file.
  publish:
    min_usage_pct: 0.1
    # Cache-Control seconds for each published file. Provisional: the
    # skill-centric job is still manual (skill_meta.collect.scheduled=false),
    # so there's no real update cadence yet to size these against -- revisit
    # once that's decided.
    index_cache_max_age_seconds: 3600       # 1h -- small file, F4 wants it fresh
    skill_file_cache_max_age_seconds: 21600 # 6h -- 150+ files, heavier to keep re-fetching
    dictionary_cache_max_age_seconds: 86400 # 24h -- changes only when GGG changes the mod pool

retention:
  char_items_days: 90
  char_details_days: 30      # shared character cache (skill-centric + legacy jobs)
  meta_files_days: 30
  failed_responses_days: 30
  log_rotate_days: 7
  # Skill-centric collection's own results tables (skill_stat_counts/
  # skill_passive_counts/skill_populations) -- NOT mod_counts/skill_mod_counts/
  # keypassive_counts (the legacy per-slot tables), which keep every row
  # forever by existing project policy and are untouched here. This dimension
  # is ~10x denser per snapshot than the legacy one (158-416 skills vs ~8
  # archetypes), so "kept forever" would be ~30GB/year at 1 run/day/game on a
  # 29GB disk -- approved 2026-09-22 alongside archive_export.py's freeze/
  # merge guard, which is what makes deleting these rows safe: a league's
  # per-league archive (data/archive/{game}-{league}.json) never shrinks even
  # after its early raw rows age out from here, as long as the weekly archive
  # re-export cadence (7 days) stays well inside this window.
  skill_stat_counts_days: 45

archive:
  # DISABLED 2026-10-18 (temporary). run_archive_export_once and the
  # league-change export (_archive_previous_league_if_changed) both load a
  # league's whole stat tables into Python lists, which pushed poe-data-hub to
  # ~2.6GB (711MB RSS + 1.9GB swap) on a 955MB VM and caused the 2026-10-15
  # outage. While false: every skipped weekly cycle logs a WARNING, status.json
  # carries archive.enabled=false (+ any league change that went unarchived),
  # and `--export-league-archive` (manual) still works but WILL OOM the VM.
  # Re-enable only after the export is rewritten to aggregate in SQL and stream
  # in chunks, and measured against the real DB. A league that changes while
  # this is false is NOT archived and its rows age out after
  # retention.skill_stat_counts_days (45d) -- fix before then.
  enabled: false
  disabled_reason: "OOM risk: export loads whole league into RAM (2026-10-15 incident); awaiting SQL/streaming rewrite"

healthchecks:
  # Layer-1 dead-man-switch pings (healthchecks.io or compatible), sent only
  # after a job's Firebase publish + readback-verify succeeds -- not just
  # "job finished". Optional: leave blank and the hub runs exactly the same,
  # just without this layer. See CLAUDE.md for the two-layer monitoring
  # design and recommended healthchecks.io Period/Grace settings.
  #
  # The ping URLs themselves are SECRETS (anyone who knows one can turn the
  # check green while the system is dead) and this repo is public, so config
  # only holds the NAME of the environment variable; src/utils/config.py
  # resolves `<job>_ping_url_env` into `<job>_ping_url` at load time. On the
  # VM the variables come from the systemd EnvironmentFile
  # /etc/poe-data-hub/healthchecks.env (outside the repo, mode 600). An unset
  # variable = that job simply does not ping.
  prices_ping_url_env: "HUB_HC_PRICES_URL"
  meta_ping_url_env: "HUB_HC_META_URL"
  news_ping_url_env: "HUB_HC_NEWS_URL"
  # Skill-centric collection's own check (approved 2026-09-22) -- fires only
  # when BOTH configured games completed this cycle with characters_distinct
  # > 0 (see _all_games_got_real_skill_characters), same "never ping on a
  # partial/empty cycle" rule as meta_ping_url. Blank until the project owner
  # creates the healthchecks.io check; recommended settings for a daily job
  # measured at ~71min combined (2026-09-22): Period 24h, Grace 4h (covers a
  # much slower cycle plus the scheduler's own misfire_grace_time=3600 if the
  # process was down right at the 05:00 ICT trigger).
  skill_meta_ping_url_env: "HUB_HC_SKILL_META_URL"
