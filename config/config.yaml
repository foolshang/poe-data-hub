# poe-data-hub configuration

firebase:
  project_id: poe-hub-b4723
  bucket: poe-data-hub

# Phase 7: PoE1 prices added alongside PoE2 (meta is still PoE2-only).
game_versions:
  - poe2
  - poe1

league:
  # Leave blank: the auto-detected non-excluded league is used as "main".
  # Only set this when two non-excluded (non-Standard/Hardcore/Ruthless)
  # leagues are active at once (an overlapping event league) and the
  # auto-picked "first candidate" guess needs to be pinned to the real
  # challenge league.
  poe2_override: ""
  # PoE1 currently has exactly this situation: poe.ninja's league list has
  # both "Ancestors" (the id for the "Return of the Ancients" time-limited
  # event) and "Mirage" (the real 3.28 challenge league) active, and
  # nothing in the API flags which is which -- "Ancestors" alphabetically
  # sorts first, so the auto-guess picks it as "main", which is backwards.
  # Confirmed via web search 2026-07-05 (see Bot-Poe-Discord's price.py) --
  # Mirage is main, Ancestors is the event layered on top of it.
  poe1_override: "Mirage"
  cache_ttl_seconds: 43200 # 12h

ggg:
  # trade2/data/stats is the one GGG endpoint this project touches (spec 3.5).
  # Fetched once, cached to disk, refreshed weekly.
  stats_cache_ttl_seconds: 604800 # 7d

rate_limits:
  # seconds between requests, per host
  "poe.ninja": 2
  "poe2scout.com": 2
  "www.pathofexile.com": 2
  "th.pathofexile.com": 2 # phase 11: link_th Thai forum scrape -- separate host/bucket from www.
  "api.steampowered.com": 2

http:
  max_retries: 3
  timeout_seconds: 15

schedule:
  # Bumped 20 -> 180 (2026-08-02): poe1/prices/latest.json alone is ~14MB and
  # was publishing every 20min from us-central1 to the asia-southeast1
  # bucket, driving most of a "Network Inter Region Data Transfer" GCP
  # billing line item (~1.5GB/day). Hash-skip-if-unchanged was considered
  # and rejected -- generated_at + live market movement means the payload
  # almost never matches previous cycle anyway, so it wouldn't have helped.
  # Bumped 180 -> 1440 (2026-09-10): one publish/day. Same egress reasoning
  # taken to its conclusion (~8x less inter-region transfer), and it removes
  # 7/8 of the daily ~80MB prices-poe1 memory spike on the 955MB e2-micro VM
  # (baseline RSS ~239MB, VmHWM ~322MB during a poe1 run -- see PRICES_MAX_AGE
  # in tools/heartbeat_check.py, bumped in lockstep). Tradeoff: published
  # prices are now up to ~24h stale. Drop this back to 180 (or lower) if
  # near-real-time pricing is needed again.
  # news kept at 5min (small files ~fetch <100 entries, freshness matters
  # more there, and it's not a memory factor -- see prices spike note above).
  prices_interval_minutes: 1440
  meta_cron_hour_thailand: 2
  # Manual escape hatch (spec section 9) -- kept for an unplanned/delayed
  # league that league_start_mode's date range below doesn't cover. Bump
  # this and restart if you ever need to force multi-run mode outside the
  # configured window. 1 = single run/day at meta_cron_hour_thailand.
  meta_runs_per_day_league_start: 1
  # Automatic per-game date-based switch (spec section 9) -- when today
  # (Asia/Bangkok calendar date) falls within ANY configured game's
  # [start_date, end_date] (both inclusive), the scheduler switches the
  # meta job to meta_runs_per_day evenly-spaced runs/day on its own, no
  # restart needed, and switches back automatically once every game's
  # window has passed. Each game's value is either a manual
  # {start_date, end_date} (always wins over auto) or "auto"/omitted, in
  # which case the scheduler derives it itself from GGG's Steam News
  # announcements (LeagueDatesFetcher.find_upcoming_launch) -- for a game
  # left on auto, there's normally nothing to do here at all; only add a
  # manual entry if auto-detection ever needs correcting. See status.json's
  # league_start_mode_detail to check what each game currently resolved to.
  league_start_mode:
    meta_runs_per_day: 4
    auto_end_date_offset_days: 21   # derived end_date = detected launch + this
    poe1:
      start_date: "2026-07-25"
      end_date: "2026-08-15"
    poe2: "auto"
  cleanup_hour_thailand: 4
  news_interval_minutes: 5
  # Republishes {game}/gems.json from the internal/ staging copy that
  # refresh-stats.yml's GitHub Actions job writes weekly (see
  # tools/refresh_gems.py, src/main.py's run_gems_once). Cheap
  # Firebase-to-Firebase copy, no external API calls -- daily is plenty.
  gems_cron_hour_thailand: 3

meta:
  sample_per_slot: 100 # NOTE: poe.ninja's builds-search endpoint has no known
                       # pagination param -- observed to always return its
                       # default top-100 page regardless of this value. Kept
                       # here per spec; see src/fetchers/ninja_builds.py.
  min_mod_count: 5

# Skill-meta phase 2: a second, orthogonal (slot, main_skill, level_bracket,
# stat_id) counting dimension alongside the archetype-based one above --
# covers gear and jewels, stored in SQLite's skill_mod_counts table (kept
# forever, same as mod_counts). See src/processing/aggregator.py and
# src/main.py's run_reprocess_char_items.
skill_meta:
  # [lo, hi] pairs, half-open [lo, hi) except the last which is closed so a
  # level-100 character always lands somewhere. A level below the first
  # bracket's lo (e.g. a fresh character) matches none and is skipped for
  # this dimension only -- it still counts normally in the existing
  # archetype-based mod_counts pipeline.
  level_brackets:
    - [28, 65]
    - [65, 75]
    - [75, 90]
    - [90, 100]
  # A (slot, main_skill, level_bracket) cell below this population is
  # considered too thin to publish on its own -- not yet wired to an actual
  # publish step (that's a later phase), but query_skill_mod_counts' 4-tier
  # fallback already uses it to decide when to widen to a coarser tier.
  min_population_publish: 20

retention:
  char_items_days: 90
  meta_files_days: 30
  failed_responses_days: 30
  log_rotate_days: 7

healthchecks:
  # Layer-1 dead-man-switch pings (healthchecks.io or compatible), sent only
  # after a job's Firebase publish + readback-verify succeeds -- not just
  # "job finished". Optional: leave blank and the hub runs exactly the same,
  # just without this layer. See CLAUDE.md for the two-layer monitoring
  # design and recommended healthchecks.io Period/Grace settings.
  prices_ping_url: "https://hc-ping.com/681a6116-a8f0-42d4-a7e6-3b2685099ccb"
  meta_ping_url: "https://hc-ping.com/98f50ed8-cff3-4392-9f3a-22af3c996a44"
  news_ping_url: "https://hc-ping.com/d4223856-ee45-43a8-befc-ed2c3b2aa704"
