name: Refresh mod-stats cache (PoE1 + PoE2)

# GGG permanently blocks trade2/data/stats from GCP IPs (see CLAUDE.md), so
# the deploy VM can't refresh this table itself. This runs from GitHub's
# hosted runners instead (confirmed reachable) and publishes the result to
# Firebase Storage, which ModNormalizer checks first on every environment.
#
# Phase 10: also refreshes PoE1's trade/data/stats (not trade2) to its own
# Firebase path (internal/stats_cache_poe1.json) -- routed through this same
# GitHub Actions path out of caution even though trade/data/stats wasn't
# independently reconfirmed blocked from GCP IPs the way trade2 was; both
# games are fetched/validated/published independently by tools/refresh_stats.py
# so one game's failure can't corrupt or block the other's cache. Both blob
# paths stay under internal/, which is all the scoped service account below
# has IAM permission to touch (CLAUDE.md) -- no permission changes needed.
#
# Skill-meta phase 1: also refreshes {game}/gems.json (tools/refresh_gems.py)
# -- the skill-gem name/metadata table used to normalize main-skill names
# before counting mod/passive meta per skill. Confirmed live 2026-09-15 that
# trade(2)/data/items is blocked from GCP IPs the same way trade(2)/data/stats
# is (200 from a dev machine, would 403 from the VM), so it needs this same
# GitHub Actions route -- even though its OTHER source, the RePoE fork on
# raw.githubusercontent.com, is not GGG-blocked and would work fine from the
# VM directly. Kept in this one job anyway so gem-table assembly (which needs
# both sources together, see refresh_gems.py) lives in one place. Independent
# step/script from the stats-cache refresh above -- a failure in one must
# never block or corrupt the other.
#
# A failed run just shows red here -- no extra alerting -- because
# ModNormalizer falls back to a stale on-disk/Firebase copy on failure
# (spec: staleness is a status.json warning humans check periodically, not
# a paging incident). Same stale-while-error reasoning applies to gems.json.
on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC (10:00 ICT)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key
        run: echo "$GCP_SA_KEY" > /tmp/stats-refresh-key.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_STATS_REFRESH_SA_KEY }}

      - name: Refresh stats cache
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/stats-refresh-key.json
        run: python -m tools.refresh_stats

      - name: Refresh gems table
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/stats-refresh-key.json
        run: python -m tools.refresh_gems

      # RePoE-derived item-text aliases for ModNormalizer's last-resort rule (tools/refresh_rendering_aliases.py).
      # Reads the stats cache published by the first step; refuses to publish over a good file when the new one is
      # empty or much smaller (so a RePoE format change shows up here as a red run). Independent of the steps above.
      - name: Refresh rendering aliases
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/stats-refresh-key.json
        run: python -m tools.refresh_rendering_aliases

      - name: Clean up key file
        if: always()
        run: rm -f /tmp/stats-refresh-key.json
