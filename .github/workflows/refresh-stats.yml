name: Refresh mod-stats cache (PoE1 + PoE2)

# GGG permanently blocks trade2/data/stats from GCP IPs (see CLAUDE.md), so
# the deploy VM can't refresh this table itself. This runs from GitHub's
# hosted runners instead (confirmed reachable) and publishes the result to
# Firebase Storage, which ModNormalizer checks first on every environment.
#
# Phase 10: also refreshes PoE1's trade/data/stats (not trade2) to its own
# Firebase path (internal/stats_cache_poe1.json) -- routed through this same
# GitHub Actions path out of caution even though trade/data/stats wasn't
# independently reconfirmed blocked from GCP IPs the way trade2 was; both
# games are fetched/validated/published independently by tools/refresh_stats.py
# so one game's failure can't corrupt or block the other's cache. Both blob
# paths stay under internal/, which is all the scoped service account below
# has IAM permission to touch (CLAUDE.md) -- no permission changes needed.
#
# A failed run just shows red here -- no extra alerting -- because
# ModNormalizer falls back to a stale on-disk/Firebase copy on failure
# (spec: staleness is a status.json warning humans check periodically, not
# a paging incident).
on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC (10:00 ICT)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key
        run: echo "$GCP_SA_KEY" > /tmp/stats-refresh-key.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_STATS_REFRESH_SA_KEY }}

      - name: Refresh stats cache
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/stats-refresh-key.json
        run: python -m tools.refresh_stats

      - name: Clean up key file
        if: always()
        run: rm -f /tmp/stats-refresh-key.json
